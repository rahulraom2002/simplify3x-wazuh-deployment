#!/bin/bash

###############################################################################
# Simplify3X Cyber Defence Team
# Wazuh Linux Endpoint Deployment Script
# Supported:
#   Ubuntu / Debian / RHEL / Rocky Linux / AlmaLinux
###############################################################################

##############################################
# Colors
##############################################
CC='\033[0;36m'
CG='\033[0;32m'
CR='\033[0;31m'
CY='\033[0;33m'
CW='\033[1;37m'
NC='\033[0m'

##############################################
# Variables
##############################################
SCRIPT_VERSION="2.2.0"
WAZUH_VERSION="4.14.5-1"

WAZUH_MANAGER="10.0.74.29"
WAZUH_GROUP="endpoints-workstations-linux"
AUTH_PASSWORD="MuVOAb1xabilNFFtJRBf9v+q50SE+oU73jwuv6xjQRc="

STAGING="/tmp/s3x_security"
LOG="/var/log/s3x_wazuh_install.log"

##############################################
# Logging Setup
##############################################
mkdir -p "$STAGING"
exec > >(tee -a "$LOG") 2>&1

##############################################
# Functions
##############################################
print_ok(){ echo -e "${CG}[ OK ] $1${NC}"; }
print_fail(){ echo -e "${CR}[FAIL] $1${NC}"; }
print_warn(){ echo -e "${CY}[WARN] $1${NC}"; }
print_step(){ echo -e "${CC}>> $1${NC}"; }

##############################################
# Root Check
##############################################
if [ "$(id -u)" -ne 0 ]; then
    print_fail "Run as root"
    echo ""
    echo "sudo ./wazuh_linux.sh"
    exit 1
fi

SCRIPT_PATH="$(realpath "$BASH_SOURCE")"
clear

echo -e "${CW}========================================================"
echo "        SIMPLIFY3X CYBER DEFENCE TEAM"
echo "          Linux Endpoint Deployment"
echo ""
echo " Version : $SCRIPT_VERSION"
echo " Wazuh   : $WAZUH_VERSION"
echo -e "========================================================${NC}\n"

##############################################
# Detect Architecture
##############################################
print_step "Detecting platform architecture..."
ARCH_RAW=$(uname -m)

case "$ARCH_RAW" in
    x86_64|amd64)
        ARCH_DEB="amd64"
        ARCH_RPM="x86_64"
        ;;
    aarch64|arm64)
        ARCH_DEB="arm64"
        ARCH_RPM="aarch64"
        ;;
    *)
        print_fail "Unsupported Architecture: $ARCH_RAW"
        exit 2
        ;;
esac

##############################################
# Detect & Update Distribution
##############################################
print_step "Detecting operating system package manager..."

if command -v apt-get >/dev/null 2>&1; then
    PKG_TYPE="deb"
    PKG_FILE="$STAGING/wazuh-agent.deb"
    DOWNLOAD_URL="https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_${WAZUH_VERSION}_${ARCH_DEB}.deb"

    apt-get update -y
    apt-get install -y wget ca-certificates

elif command -v dnf >/dev/null 2>&1; then
    PKG_TYPE="rpm"
    PKG_FILE="$STAGING/wazuh-agent.rpm"
    DOWNLOAD_URL="https://packages.wazuh.com/4.x/yum/wazuh-agent-${WAZUH_VERSION}.${ARCH_RPM}.rpm"

    dnf install -y wget ca-certificates

elif command -v yum >/dev/null 2>&1; then
    PKG_TYPE="rpm"
    PKG_FILE="$STAGING/wazuh-agent.rpm"
    DOWNLOAD_URL="https://packages.wazuh.com/4.x/yum/wazuh-agent-${WAZUH_VERSION}.${ARCH_RPM}.rpm"

    yum install -y wget ca-certificates

else
    print_fail "Unsupported Linux Distribution"
    exit 3
fi

print_ok "Distribution verified ($PKG_TYPE package structure format)"
print_ok "Architecture Type : $ARCH_RAW"

##############################################
# Remove Existing Agent Cleanly
##############################################
print_step "Purging existing installations to ensure a clean state..."

systemctl stop wazuh-agent 2>/dev/null || true
pkill -f wazuh-agent 2>/dev/null || true
pkill -f ossec-agent 2>/dev/null || true

if [ "$PKG_TYPE" = "deb" ]; then
    apt-get remove -y wazuh-agent 2>/dev/null || true
    apt-get purge -y wazuh-agent 2>/dev/null || true
else
    rpm -e wazuh-agent 2>/dev/null || true
fi

rm -rf /var/ossec
print_ok "Previous configuration and data removed cleanly"

##############################################
# Download Package (With Network Resilience)
##############################################
print_step "Downloading target Wazuh Agent binary package..."

wget --tries=3 --retry-connrefused --waitretry=3 -O "$PKG_FILE" "$DOWNLOAD_URL"

if [ ! -s "$PKG_FILE" ]; then
    print_fail "Binary file download failed or payload size calculated as empty."
    exit 4
fi
print_ok "Download transaction successful"

##############################################
# Install Agent with Environment Variables
##############################################
print_step "Installing target package binary..."

if [ "$PKG_TYPE" = "deb" ]; then
    WAZUH_MANAGER="$WAZUH_MANAGER" \
    WAZUH_AGENT_GROUP="$WAZUH_GROUP" \
    WAZUH_REGISTRATION_PASSWORD="$AUTH_PASSWORD" \
    dpkg -i "$PKG_FILE"
else
    WAZUH_MANAGER="$WAZUH_MANAGER" \
    WAZUH_AGENT_GROUP="$WAZUH_GROUP" \
    WAZUH_REGISTRATION_PASSWORD="$AUTH_PASSWORD" \
    rpm -ivh --replacepkgs "$PKG_FILE"
fi

if [ $? -ne 0 ]; then
    print_fail "Installation execution sequence faulted"
    exit 5
fi
print_ok "Installation phase completed successfully"

##############################################
# Apply Valid Schema Configuration File
##############################################
print_step "Applying verified Simplify3X configuration profile..."

cat > /var/ossec/etc/ossec.conf << 'EOF'
<ossec_config>
  <client>
    <server>
      <address>10.0.74.29</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <server>
      <address>103.117.237.116</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <config-profile>ubuntu, ubuntu24, ubuntu24.04, debian, rhel, rocky, almalinux</config-profile>

    <notify_time>20</notify_time>
    <time-reconnect>60</time-reconnect>

    <force_reconnect_interval>1h</force_reconnect_interval>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>

    <enrollment>
      <enabled>yes</enabled>
      <groups>endpoints-workstations-linux</groups>
      <manager_address>10.0.74.29</manager_address>
      <manager_address>103.117.237.116</manager_address>
      <port>1515</port>
      </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <frequency>43200</frequency>

    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>

    <skip_nfs>yes</skip_nfs>

    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>

    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>yes</groups>
    <services>yes</services>
    <browser_extensions>yes</browser_extensions>

    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <ignore type="sregex">.log$|.swp$</ignore>

    <nodiff>/etc/ssl/private.key</nodiff>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>

    <process_priority>10</process_priority>
    <max_eps>50</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
    <ca_store>etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
EOF

print_ok "Configuration schema applied securely"

##############################################
# Start Service
##############################################
print_step "Initializing daemon initialization loops..."

systemctl daemon-reload
systemctl enable wazuh-agent
systemctl restart wazuh-agent

sleep 5

STATUS=$(systemctl is-active wazuh-agent)
if [ "$STATUS" != "active" ]; then
    print_fail "Service execution failed during start block"
    systemctl status wazuh-agent --no-pager
    exit 6
fi
print_ok "Service state verified as active"

##############################################
# Enrollment Verification Check
##############################################
print_step "Verifying registration handshake..."
sleep 5

if grep -qi "Connected to the server" /var/ossec/logs/ossec.log; then
    print_ok "Agent verified and connected successfully to the manager cluster."
elif grep -qi "Requesting a key" /var/ossec/logs/ossec.log; then
    print_ok "Registration handshake requests issued cleanly."
else
    print_warn "Daemon active, awaiting next enrollment cycle. Verify firewall matrix to $WAZUH_MANAGER."
fi

##############################################
# Clean Up Context Execution
##############################################
print_step "Removing local installation artifacts..."
rm -f "$PKG_FILE"

# Background asynchronous wrapper loop to wipe runtime files
(
    sleep 3
    rmdir "$STAGING" 2>/dev/null
    rm -f "$SCRIPT_PATH"
) >/dev/null 2>&1 &
disown

##############################################
# Execution Complete Summary
##############################################
echo ""
echo -e "${CG}========================================================"
echo "        WAZUH AGENT DEPLOYMENT COMPLETED"
echo "========================================================"
echo " Manager : $WAZUH_MANAGER"
echo " Group   : $WAZUH_GROUP"
echo " Log     : $LOG"
echo -e "========================================================${NC}"

exit 0
